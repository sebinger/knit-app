org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Jetifier is intentionally off: the app depends only on AndroidX.
android.enableJetifier=false
# Command-line and CI builds download missing SDK platforms and build-tools
# after the SDK licenses are accepted. Android Studio still uses its SDK Manager.
android.builder.sdkDownload=true
